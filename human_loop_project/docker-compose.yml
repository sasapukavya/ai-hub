services:

  app:
    build: .
    container_name: human-loop-app

    ports:
      - "8501:8501"

    env_file:
      - .env

    depends_on:
      - cosmos-emulator

    networks:
      - human-network

    restart: always

  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest

    container_name: cosmos-emulator

    ports:
      - "8081:8081"
      - "1234:1234"

    environment:
      ACCEPT_EULA: "Y"

    volumes:
      - cosmos-data:/data

    networks:
      - human-network

    restart: always

volumes:
  cosmos-data:

networks:
  human-network: